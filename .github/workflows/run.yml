name: Deriv H4 H1 BOS Monitor

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install websocket-client requests

      - name: Run script
        run: python bot.py
        
